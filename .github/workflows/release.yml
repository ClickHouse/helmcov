name: release

# Called by release-please: tags it creates with GITHUB_TOKEN don't trigger tag-push workflows.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (example: v0.5.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Stops goreleaser picking v1 when it points at the same commit.
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
      - name: Upload GoReleaser dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goreleaser-dist-${{ env.TAG }}
          path: dist
          if-no-files-found: error

  # Separate from goreleaser so a failed attestation can be re-run without
  # rebuilding, and never blocks the v1 tag. Verify with: gh attestation verify <file> --repo ClickHouse/helmcov
  attest:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: goreleaser-dist-${{ env.TAG }}
          path: dist
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  update-action-tag:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Update v1 action tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1 HEAD
          git push origin v1 --force

  vendor-artifacts:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      packages: read
    steps:
      - name: Resolve version from tag
        id: version
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Download GoReleaser dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: goreleaser-dist-${{ env.TAG }}
          path: dist
      - name: Validate dist contents
        run: |
          if [ -z "$(ls -A dist)" ]; then
            echo "dist artifact is empty" >&2
            exit 1
          fi
      - name: Record image references
        run: |
          {
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helmcov:v${{ steps.version.outputs.value }}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helmcov:latest"
          } > dist/image-refs.txt
      - name: Upload vendored artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helmcov-v${{ steps.version.outputs.value }}
          path: dist
