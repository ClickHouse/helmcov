name: release

# Called by release-please: tags it creates with GITHUB_TOKEN don't trigger tag-push workflows.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (example: v0.5.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag }}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Stops goreleaser picking v1 when it points at the same commit.
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
      - name: Upload GoReleaser dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: goreleaser-dist-${{ env.TAG }}
          path: dist
          if-no-files-found: error

  update-action-tag:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Update v1 action tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1 HEAD
          git push origin v1 --force

  vendor-artifacts:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      packages: read
    steps:
      - name: Resolve version from tag
        id: version
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Download GoReleaser dist artifact
        uses: actions/download-artifact@v8
        with:
          name: goreleaser-dist-${{ env.TAG }}
          path: dist
      - name: Validate dist contents
        run: |
          if [ -z "$(ls -A dist)" ]; then
            echo "dist artifact is empty" >&2
            exit 1
          fi
      - name: Record image references
        run: |
          {
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helmcov:v${{ steps.version.outputs.value }}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helmcov:latest"
          } > dist/image-refs.txt
      - name: Upload vendored artifacts
        uses: actions/upload-artifact@v7
        with:
          name: helmcov-v${{ steps.version.outputs.value }}
          path: dist
