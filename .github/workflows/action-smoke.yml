name: action-smoke

# Runs the published action the way users do: ClickHouse/helmcov@v1 downloading
# the latest release, checking its checksum and running it on every platform.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  released-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Fail rather than fall back to a source build, so a broken download shows up here.
      HELMCOV_REQUIRE_RELEASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ClickHouse/helmcov@v1
        with:
          chart: examples/branch-heavy-chart
          version: latest
          comment: "false"
