name: helmcov-action

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run helmcov action (single chart)
        id: helmcov
        uses: ./
        with:
          chart: examples/branch-heavy-chart
          tests: examples/branch-heavy-chart/tests
          version: dev
          threshold: "0"
          branch-threshold: "1"

      - name: Check action outputs
        env:
          LINE: ${{ steps.helmcov.outputs.line-coverage }}
          BRANCH: ${{ steps.helmcov.outputs.branch-coverage }}
          LINE_TESTS: ${{ steps.helmcov.outputs.line-coverage-tests }}
          BRANCH_TESTS: ${{ steps.helmcov.outputs.branch-coverage-tests }}
          MARKDOWN: ${{ steps.helmcov.outputs.markdown-file }}
        run: |
          echo "line=$LINE branch=$BRANCH line-tests=$LINE_TESTS branch-tests=$BRANCH_TESTS markdown=$MARKDOWN"
          for pct in "$LINE" "$BRANCH" "$LINE_TESTS" "$BRANCH_TESTS"; do
            [[ "$pct" =~ ^[0-9]+\.[0-9]+$ ]]
          done
          [[ -f "$MARKDOWN" ]]

  monorepo-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run helmcov action (monorepo)
        uses: ./
        with:
          charts: examples/monorepo/charts
          version: dev
          comment: "false"

