name: Feature request
description: A template construct, output format or option helmcov should support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The chart pattern or workflow that helmcov does not handle today.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A template snippet or command showing the case.
