suite: configmap
templates:
  - templates/configmap.yaml
capabilities:
  apiVersions:
    - batch/v1
tests:
  - it: renders enabled feature by default
    asserts:
      - equal:
          path: data.feature
          value: enabled
      - matchRegex:
          path: data.greeting
          pattern: -basic-chart$
      - equal:
          path: data.notice
          value: loaded from chart files
      - equal:
          path: data.theme
          value: dark
      - equal:
          path: data.batchSupported
          value: "true"
  - it: renders disabled feature from values file
    values:
      - values/disabled.yaml
    asserts:
      - equal:
          path: data.feature
          value: disabled
