apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "constructs.fullname" . }}-scopes
data:
  {{- $debug := .Values.debug }}
  {{- with .Values.config }}
  {{- if $debug }}
  verbose: "true"
  {{- end }}
  greeting: {{ .greeting }}
  {{- else with .Values.fallback }}
  greeting: {{ . }}
  {{- end }}
  {{- range .Values.items }}
  {{- include "constructs.item" . | nindent 2 }}
  {{- end }}
  message: {{ tpl .Values.message . | quote }}
