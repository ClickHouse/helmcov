suite: defaults
templates:
  - templates/conditionals.yaml
  - templates/loops.yaml
  - templates/scopes.yaml
  - templates/functions.yaml
tests:
  - it: renders with chart defaults
    asserts:
      - isKind:
          of: ConfigMap
  - it: renders staging mode from its own set value
    template: templates/conditionals.yaml
    set:
      mode: staging
    asserts:
      - equal:
          path: data.mode
          value: staging
