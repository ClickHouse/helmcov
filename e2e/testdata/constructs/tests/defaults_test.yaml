suite: defaults
templates:
  - templates/conditionals.yaml
  - templates/loops.yaml
  - templates/scopes.yaml
  - templates/functions.yaml
tests:
  - it: renders with chart defaults
    asserts:
      - isKind:
          of: ConfigMap
  - it: renders staging mode from its own set value
    template: templates/conditionals.yaml
    set:
      mode: staging
    asserts:
      - equal:
          path: data.mode
          value: staging
  - it: finds an existing ConfigMap through lookup
    template: templates/functions.yaml
    kubernetesProvider:
      scheme:
        "v1/ConfigMap": {gvr: {version: v1, resource: configmaps}, namespaced: true}
      objects:
        - {kind: ConfigMap, apiVersion: v1, metadata: {name: existing, namespace: NAMESPACE}}
    asserts:
      - equal:
          path: data.existing
          value: "true"
